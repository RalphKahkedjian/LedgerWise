version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: ledgerwise-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: LedgerWiseDb

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .

    container_name: ledgerwise-api

    depends_on:
      - postgres

    ports:
      - "5109:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=LedgerWiseDb;Username=postgres;Password=postgres

volumes:
  postgres-data: